apiVersion: v1
kind: Service
metadata:
  name: {{ include "md-reader.frontend.serviceName" . }}
  labels:
    {{- include "md-reader.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "md-reader.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: 80
      protocol: TCP

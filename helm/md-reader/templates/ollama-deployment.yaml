apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "md-reader.fullname" . }}-ollama
  labels:
    {{- include "md-reader.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "md-reader.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ollama
  template:
    metadata:
      labels:
        {{- include "md-reader.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ollama
    spec:
      {{- include "md-reader.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: ollama
          image: {{ include "md-reader.image" (dict "imageValues" .Values.ollama.image "global" .Values.global) }}
          imagePullPolicy: {{ .Values.ollama.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 11434
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 6
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
          {{- with .Values.ollama.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.ollama.gpuResources }}
          resources:
            {{- toYaml .Values.ollama.gpuResources | nindent 12 }}
          {{- end }}
      volumes:
        - name: ollama-data
          persistentVolumeClaim:
            claimName: {{ include "md-reader.fullname" . }}-ollama-data

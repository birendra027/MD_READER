apiVersion: v1
kind: Service
metadata:
  name: {{ include "md-reader.ollama.serviceName" . }}
  labels:
    {{- include "md-reader.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  type: {{ .Values.ollama.service.type }}
  selector:
    {{- include "md-reader.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
  ports:
    - name: http
      port: {{ .Values.ollama.service.port }}
      targetPort: 11434
      protocol: TCP

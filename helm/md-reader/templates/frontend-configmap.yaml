apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "md-reader.fullname" . }}-nginx-conf
  labels:
    {{- include "md-reader.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # ── API proxy → backend ────────────────────────────────────
        location /api/ {
            proxy_pass         http://{{ include "md-reader.backend.serviceName" . }}:{{ .Values.backend.service.port }};
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        location /chat/ {
            proxy_pass         http://{{ include "md-reader.backend.serviceName" . }}:{{ .Values.backend.service.port }};
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            # SSE: disable buffering so tokens stream immediately
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 300s;
        }

        # ── WebSocket proxy → backend ──────────────────────────────
        location /ws {
            proxy_pass         http://{{ include "md-reader.backend.serviceName" . }}:{{ .Values.backend.service.port }};
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 3600s;
        }

        # ── SPA fallback ───────────────────────────────────────────
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "md-reader.fullname" . }}-frontend
  labels:
    {{- include "md-reader.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "md-reader.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "md-reader.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
      # Restart pods when the nginx ConfigMap changes.
      annotations:
        checksum/nginx-conf: {{ include (print $.Template.BasePath "/frontend-configmap.yaml") . | sha256sum }}
    spec:
      {{- include "md-reader.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: frontend
          image: {{ include "md-reader.image" (dict "imageValues" .Values.frontend.image "global" .Values.global) }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            # Override the nginx config baked into the image with the
            # ConfigMap that has the correct K8s service DNS names.
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          {{- with .Values.frontend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ include "md-reader.fullname" . }}-nginx-conf
